<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>店員用：プレイリストを公開</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Shippori+Mincho:wght@800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--panel:#100e0a;--ink:#f1e8d4;--sub:#a89a78;--gold:#c9a85c;--gold-hi:#f3e2ab;--line:#2f2719;--grad:linear-gradient(135deg,#7a5c22 0%,#f3e2ab 38%,#c9a85c 62%,#7a5c22 100%)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse 90% 40% at 50% 0,rgba(201,168,92,.15),transparent 70%) no-repeat,var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.7;min-height:100vh;padding:calc(34px + env(safe-area-inset-top,0px)) 22px calc(56px + env(safe-area-inset-bottom,0px))}
main{max-width:480px;margin:0 auto}
.brand{text-align:center;font-family:"Cormorant Garamond",serif;font-weight:600;letter-spacing:.46em;padding-left:.46em;color:var(--gold);margin:0 0 22px}
h1{font-family:"Shippori Mincho",serif;font-weight:800;font-size:1.55rem;letter-spacing:.14em;text-align:center;margin:0 0 8px;color:var(--gold-hi);background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p.lead{color:var(--sub);text-align:center;margin:0 0 26px;font-size:.9rem}
form{padding:8px 22px 26px;border:1px solid transparent;border-radius:6px;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box}
label{display:block;font-weight:700;margin:20px 0 6px;color:var(--gold)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:#0b0a07;border:1px solid var(--line);border-radius:3px;padding:13px}
textarea{min-height:92px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
.hint{color:var(--sub);font-size:.82rem;margin:5px 0 0}
button{width:100%;margin-top:28px;font:inherit;font-weight:700;font-size:1.05rem;letter-spacing:.24em;color:#0a0a0a;background:var(--grad);background-size:220% 100%;border:0;border-radius:999px;padding:15px;cursor:pointer;transition:background-position .7s}
button:hover{background-position:100% 0}
button:disabled{opacity:.6;cursor:wait}
#status{margin:16px 0 0;font-weight:700;min-height:1.7em;text-align:center}
#status.ok{color:#9fe3b4}#status.ng{color:#ff9aa8}
.back{text-align:center;margin-top:24px}
a{color:var(--gold-hi)}
</style>
</head>
<body>
<main>
  <p class="brand">HUNG O BAR</p>
  <h1>プレイリストを公開する</h1>
  <p class="lead">Spotifyでその夜のプレイリストを作り、共有リンクをコピーしてから入力します。</p>
  <form id="f" autocomplete="off">
    <label for="url">プレイリストのリンク</label>
    <input id="url" type="url" inputmode="url" placeholder="https://open.spotify.com/playlist/…" required>
    <p class="hint">プレイリストはSpotifyで「公開」にしておいてください。</p>
    <label for="msg">今夜の一言（80文字まで）</label>
    <textarea id="msg" maxlength="80" placeholder="例：大丈夫、みんな音は外してました。"></textarea>
    <label for="pw">パスワード</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">公開する</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <p class="back"><a href="index.html" target="_blank" rel="noopener">お客さん用ページを確認する</a></p>
</main>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxxhOcdfbiSnWkIbaymaKrlpP9oS04Q2DWcmdEVuFsz7Blpc0qKf_RBwsEadUpvKvdZlw/exec';

const f = document.getElementById('f');
const go = document.getElementById('go');
const st = document.getElementById('status');

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  go.disabled = true;
  st.className = '';
  st.textContent = '公開しています…';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        password: document.getElementById('pw').value,
        url: document.getElementById('url').value.trim(),
        message: document.getElementById('msg').value.trim()
      })
    });
    const d = await res.json();
    if (d.ok) {
      st.className = 'ok';
      st.textContent = '公開しました。お客さん用ページに反映されます。';
      document.getElementById('url').value = '';
      document.getElementById('msg').value = '';
    } else {
      st.className = 'ng';
      st.textContent = d.error || '公開できませんでした。';
    }
  } catch (err) {
    st.className = 'ng';
    st.textContent = '送信できませんでした。電波を確認して、もう一度お試しください。';
  }
  go.disabled = false;
});
</script>
</body>
</html>
